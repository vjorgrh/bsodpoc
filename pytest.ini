[pytest]
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    bsod: bsod tests
    krkn: krkn-lib chaos scenario (declares scenario + params read by the krknChaos fixture)
    tunnel: uses a persistent virtctl ssh ControlMaster tunnel into the guest
    check: ad-hoc connectivity/latency check over an ssh tunnel
    benchmark: tests to run benchmark runner scenarios
